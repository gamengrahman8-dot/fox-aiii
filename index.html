<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FOX AI</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

:root{
 --bg:#090909;
 --panel:#111111;
 --panel2:#171717;
 --border:#292929;
 --text:#f5f5f5;
 --muted:#999;
 --orange:#ff7900;
 --orange2:#ff3d00;
 --danger:#ff4545;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
 overflow:hidden;
}

button,input,textarea{
 font:inherit;
}

button{
 border:0;
 cursor:pointer;
}

.app{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
}

header{
 height:62px;
 flex-shrink:0;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 background:rgba(10,10,10,.94);
 border-bottom:1px solid var(--border);
 z-index:20;
}

.logo{
 color:var(--orange);
 font-size:20px;
 font-weight:800;
 letter-spacing:1px;
}

.header-btn{
 width:42px;
 height:42px;
 border-radius:13px;
 background:#181818;
 color:white;
 border:1px solid #292929;
 font-size:22px;
}

.content{
 flex:1;
 min-height:0;
 position:relative;
}

.tab{
 display:none;
 width:100%;
 height:100%;
 overflow:auto;
}

.tab.active{
 display:block;
}

.bottom-nav{
 height:70px;
 flex-shrink:0;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 background:#0d0d0d;
 border-top:1px solid var(--border);
 z-index:20;
}

.nav-btn{
 background:transparent;
 color:#777;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:5px;
 font-size:12px;
}

.nav-btn.active{
 color:var(--orange);
}

.nav-icon{
 font-size:21px;
 line-height:1;
}

/* MUSIC */
.music-wrap{
 padding:18px 15px 30px;
}

.cover{
 width:min(330px,80vw);
 aspect-ratio:1;
 margin:5px auto 18px;
 border-radius:28px;
 overflow:hidden;
 background:
 linear-gradient(145deg,#242424,#0e0e0e);
 border:1px solid #303030;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.cover img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:none;
}

.cover .default-cover{
 font-size:70px;
 color:#555;
}

.song-title{
 text-align:center;
 font-size:21px;
 font-weight:700;
 margin:10px 0 4px;
}

.song-meta{
 text-align:center;
 color:var(--muted);
 font-size:13px;
}

.audio{
 width:100%;
 margin-top:15px;
}

.music-actions{
 display:flex;
 justify-content:center;
 gap:12px;
 margin:14px 0 20px;
}

.circle-btn{
 width:54px;
 height:54px;
 border-radius:50%;
 background:#1a1a1a;
 color:white;
 border:1px solid #303030;
 font-size:20px;
}

.circle-btn.main{
 width:64px;
 height:64px;
 background:var(--orange);
 color:#000;
 font-weight:bold;
}

.file-picker{
 display:block;
 width:100%;
 padding:15px;
 text-align:center;
 border-radius:17px;
 border:1px dashed #444;
 background:#141414;
 color:#ddd;
 margin-bottom:18px;
}

.track-list{
 display:flex;
 flex-direction:column;
 gap:9px;
}

.track{
 display:flex;
 align-items:center;
 gap:11px;
 padding:10px;
 border:1px solid #242424;
 background:#111;
 border-radius:16px;
}

.track.active{
 border-color:var(--orange);
}

.track-cover{
 width:52px;
 height:52px;
 border-radius:12px;
 object-fit:cover;
 background:#222;
 flex-shrink:0;
}

.track-info{
 min-width:0;
 flex:1;
}

.track-name{
 font-size:15px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.track-duration{
 font-size:12px;
 color:#777;
 margin-top:4px;
}

/* CALCULATOR */
.calc{
 padding:15px;
 height:100%;
 display:flex;
 flex-direction:column;
}

.calc-display{
 width:100%;
 min-height:100px;
 border-radius:20px;
 background:#101010;
 border:1px solid #292929;
 padding:20px;
 font-size:36px;
 text-align:left;
 direction:ltr;
 overflow:auto;
 display:flex;
 align-items:flex-end;
 justify-content:flex-end;
 margin-bottom:12px;
}

.calc-grid{
 flex:1;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:9px;
}

.calc-btn{
 border-radius:17px;
 background:#181818;
 color:white;
 border:1px solid #272727;
 font-size:21px;
}

.calc-btn.op{
 color:var(--orange);
}

.calc-btn.equal{
 background:var(--orange);
 color:#000;
}

/* MAP */
.map-wrap{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
}

.map-tools{
 padding:10px;
 display:flex;
 gap:8px;
 background:#0d0d0d;
 z-index:10;
}

.map-search{
 flex:1;
 min-width:0;
 padding:13px;
 border-radius:14px;
 border:1px solid #303030;
 background:#171717;
 color:white;
 outline:none;
}

.map-btn{
 width:48px;
 border-radius:14px;
 background:#1a1a1a;
 color:white;
 border:1px solid #303030;
}

.map-btn.location{
 color:var(--orange);
}

#map{
 flex:1;
 min-height:0;
}

.coordinates{
 padding:10px 13px;
 background:#101010;
 color:#bbb;
 font-size:12px;
 border-top:1px solid #292929;
}

/* AI */
.ai-tab{
 display:flex;
 flex-direction:column;
 height:100%;
}

.ai-messages{
 flex:1;
 overflow:auto;
 padding:18px 13px 12px;
}

.welcome{
 text-align:center;
 padding:45px 15px;
}

.welcome h1{
 color:var(--orange);
 font-size:30px;
 margin:0 0 10px;
}

.welcome p{
 color:#888;
 line-height:1.8;
}

.msg{
 margin:0 0 20px;
 display:flex;
 flex-direction:column;
}

.msg.user{
 align-items:flex-end;
}

.msg.ai{
 align-items:flex-start;
}

.msg-name{
 font-size:11px;
 color:#777;
 margin:0 7px 5px;
}

.msg-text{
 max-width:92%;
 font-size:18px;
 line-height:1.9;
 white-space:pre-wrap;
 word-break:break-word;
}

.user .msg-text{
 background:#1b1b1b;
 border:1px solid #292929;
 padding:10px 14px;
 border-radius:17px 17px 4px 17px;
}

.ai .msg-text{
 padding:2px 7px;
}

.msg-actions{
 display:flex;
 gap:7px;
 margin-top:7px;
}

.msg-action{
 background:#171717;
 color:#999;
 border:1px solid #292929;
 padding:6px 9px;
 border-radius:9px;
 font-size:11px;
}

.code{
 direction:ltr;
 text-align:left;
 background:#050505;
 border:1px solid #292929;
 border-radius:13px;
 padding:13px;
 margin:10px 0;
 overflow:auto;
 position:relative;
 font-family:monospace;
 white-space:pre;
 font-size:13px;
}

.code-copy{
 position:absolute;
 top:7px;
 right:7px;
 background:#222;
 color:#ddd;
 border:1px solid #333;
 padding:5px 8px;
 border-radius:7px;
 font-size:10px;
}

.ai-input-area{
 padding:9px 10px 11px;
 border-top:1px solid #252525;
 background:#0b0b0b;
}

.ai-input-box{
 display:flex;
 align-items:flex-end;
 gap:8px;
 background:#151515;
 border:1px solid #303030;
 border-radius:18px;
 padding:8px;
}

#aiInput{
 flex:1;
 resize:none;
 min-height:44px;
 max-height:140px;
 background:transparent;
 border:0;
 outline:none;
 color:white;
 font-size:17px;
 line-height:1.6;
 padding:5px 7px;
}

.send{
 width:46px;
 height:46px;
 flex-shrink:0;
 border-radius:14px;
 background:var(--orange);
 color:#000;
 font-size:20px;
 font-weight:bold;
}

.send:disabled{
 opacity:.45;
}

.typing{
 color:#888;
 font-size:14px;
 padding:5px;
}

/* SIDE MENU */
.overlay{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.65);
 z-index:50;
 display:none;
}

.overlay.show{
 display:block;
}

.side{
 position:fixed;
 top:0;
 right:0;
 width:min(330px,88vw);
 height:100%;
 background:#111;
 border-left:1px solid #303030;
 z-index:60;
 transform:translateX(105%);
 transition:.25s;
 padding:18px;
 overflow:auto;
}

.side.show{
 transform:translateX(0);
}

.side-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding-bottom:18px;
 border-bottom:1px solid #292929;
}

.side-title{
 color:var(--orange);
 font-weight:bold;
 font-size:19px;
}

.side-close{
 background:#202020;
 color:white;
 width:40px;
 height:40px;
 border-radius:12px;
}

.side-item{
 width:100%;
 padding:15px;
 margin-top:10px;
 text-align:right;
 background:#171717;
 color:white;
 border:1px solid #292929;
 border-radius:14px;
}

.history-title{
 margin-top:22px;
 color:#888;
 font-size:12px;
}

.history-item{
 padding:12px;
 margin-top:8px;
 border-radius:12px;
 background:#161616;
 color:#ddd;
 font-size:13px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

/* MODAL */
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.72);
 z-index:100;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal.show{
 display:flex;
}

.modal-box{
 width:min(430px,100%);
 background:#141414;
 border:1px solid #333;
 border-radius:22px;
 padding:20px;
}

.modal-box h2{
 margin-top:0;
 color:var(--orange);
}

.modal-text{
 color:#aaa;
 line-height:1.8;
 font-size:14px;
}

.modal-btn{
 width:100%;
 padding:13px;
 border-radius:13px;
 margin-top:10px;
 background:#202020;
 color:white;
}

.modal-btn.primary{
 background:var(--orange);
 color:#000;
}

.status{
 margin-top:10px;
 padding:10px;
 border-radius:10px;
 background:#101010;
 color:#999;
 font-size:12px;
 word-break:break-word;
}

@media(max-width:380px){
 .msg-text{font-size:16px}
 .calc-display{font-size:30px}
}
</style>
</head>

<body>

<div class="app">

<header>
 <button class="header-btn" onclick="newChat()">+</button>
 <div class="logo">FOX AI</div>
 <button class="header-btn" onclick="openMenu()">☰</button>
</header>

<div class="content">

<!-- MUSIC -->
<section id="musicTab" class="tab active">
 <div class="music-wrap">

  <div class="cover">
   <img id="mainCover">
   <div id="defaultCover" class="default-cover">♪</div>
  </div>

  <div id="songTitle" class="song-title">هنوز آهنگی انتخاب نشده</div>
  <div id="songMeta" class="song-meta">آهنگ‌های گوشی خود را اضافه کنید</div>

  <audio id="audio" class="audio" controls></audio>

  <div class="music-actions">
   <button class="circle-btn" onclick="previousTrack()">‹</button>
   <button class="circle-btn main" onclick="togglePlay()" id="playBtn">▶</button>
   <button class="circle-btn" onclick="nextTrack()">›</button>
  </div>

  <label class="file-picker">
   انتخاب آهنگ از گوشی
   <input id="musicInput" type="file" accept="audio/*" multiple hidden>
  </label>

  <div id="trackList" class="track-list"></div>

 </div>
</section>

<!-- CALCULATOR -->
<section id="calcTab" class="tab">
 <div class="calc">

  <div id="calcDisplay" class="calc-display">0</div>

  <div class="calc-grid">
   <button class="calc-btn op" onclick="clearCalc()">AC</button>
   <button class="calc-btn op" onclick="backCalc()">⌫</button>
   <button class="calc-btn op" onclick="calcInput('%')">%</button>
   <button class="calc-btn op" onclick="calcInput('/')">÷</button>

   <button class="calc-btn" onclick="calcInput('7')">7</button>
   <button class="calc-btn" onclick="calcInput('8')">8</button>
   <button class="calc-btn" onclick="calcInput('9')">9</button>
   <button class="calc-btn op" onclick="calcInput('*')">×</button>

   <button class="calc-btn" onclick="calcInput('4')">4</button>
   <button class="calc-btn" onclick="calcInput('5')">5</button>
   <button class="calc-btn" onclick="calcInput('6')">6</button>
   <button class="calc-btn op" onclick="calcInput('-')">−</button>

   <button class="calc-btn" onclick="calcInput('1')">1</button>
   <button class="calc-btn" onclick="calcInput('2')">2</button>
   <button class="calc-btn" onclick="calcInput('3')">3</button>
   <button class="calc-btn op" onclick="calcInput('+')">+</button>

   <button class="calc-btn" onclick="calcInput('0')">0</button>
   <button class="calc-btn" onclick="calcInput('.')">.</button>
   <button class="calc-btn equal" style="grid-column:span 2" onclick="calculate()">=</button>
  </div>

 </div>
</section>

<!-- MAP -->
<section id="mapTab" class="tab">
 <div class="map-wrap">

  <div class="map-tools">
   <input id="mapSearch"
          class="map-search"
          placeholder="جستجوی مکان...">
   <button class="map-btn" onclick="searchMap()">جستجو</button>
   <button class="map-btn location" onclick="myLocation()">●</button>
  </div>

  <div id="map"></div>

  <div id="coordinates" class="coordinates">
   مختصات: انتخاب نشده
  </div>

 </div>
</section>

<!-- AI -->
<section id="aiTab" class="tab ai-tab">

 <div id="aiMessages" class="ai-messages">

  <div class="welcome" id="welcome">
   <h1>FOX AI</h1>
   <p>
    آماده پاسخ‌گویی با Gemini
   </p>
  </div>

 </div>

 <div class="ai-input-area">
  <div class="ai-input-box">
   <textarea id="aiInput"
             placeholder="پیام خود را بنویسید..."
             rows="1"></textarea>

   <button id="sendBtn"
           class="send"
           onclick="sendAI()">↑</button>
  </div>
 </div>

</section>

</div>

<nav class="bottom-nav">

 <button class="nav-btn active" onclick="showTab('music',this)">
  <span class="nav-icon">♫</span>
  <span>موزیک</span>
 </button>

 <button class="nav-btn" onclick="showTab('calc',this)">
  <span class="nav-icon">＋</span>
  <span>ماشین‌حساب</span>
 </button>

 <button class="nav-btn" onclick="showTab('map',this)">
  <span class="nav-icon">⌖</span>
  <span>نقشه</span>
 </button>

 <button class="nav-btn" onclick="showTab('ai',this)">
  <span class="nav-icon">AI</span>
  <span>هوش مصنوعی</span>
 </button>

</nav>

</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<aside id="side" class="side">

 <div class="side-head">
  <div class="side-title">FOX AI</div>
  <button class="side-close" onclick="closeMenu()">×</button>
 </div>

 <button class="side-item" onclick="newChat();closeMenu()">
  گفتگوی جدید
 </button>

 <button class="side-item" onclick="testGemini()">
  تست اتصال Gemini
 </button>

 <button class="side-item" onclick="clearHistory()">
  پاک کردن سابقه چت
 </button>

 <button class="side-item" onclick="showAbout()">
  درباره برنامه
 </button>

 <div class="history-title">سابقه گفتگو</div>

 <div id="historyList"></div>

</aside>

<div id="modal" class="modal" onclick="closeModal(event)">
 <div class="modal-box">
  <h2 id="modalTitle">FOX AI</h2>
  <div id="modalText" class="modal-text"></div>
  <div id="modalStatus" class="status"></div>
  <button class="modal-btn primary" onclick="hideModal()">بستن</button>
 </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   GEMINI
   فقط کلید خودت را اینجا قرار بده
   ===================================================== */

const GEMINI_API_KEY = "AQ.Ab8RN6IsGtbb-7VNXMlcvAIdTtV2gq3WmAaiBVuc6Wa4bUFmkg";

/*
  نام مدل را مطابق مدل موجود در Google AI Studio قرار بده.
  مقدار پیش‌فرض فعلی:
*/
const GEMINI_MODEL = "gemini-3.6-flash";

const GEMINI_URL =
 "https://generativelanguage.googleapis.com/v1beta/models/"
 + GEMINI_MODEL
 + ":generateContent";


/* =====================================================
   TAB SYSTEM
   ===================================================== */

function showTab(name,btn){

 document.querySelectorAll(".tab")
   .forEach(x=>x.classList.remove("active"));

 document.querySelectorAll(".nav-btn")
   .forEach(x=>x.classList.remove("active"));

 document.getElementById(name+"Tab")
   .classList.add("active");

 if(btn) btn.classList.add("active");

 if(name==="map"){
   setTimeout(()=>{
     if(window.map) map.invalidateSize();
   },100);
 }
}


/* =====================================================
   MUSIC PLAYER
   ===================================================== */

const musicInput =
 document.getElementById("musicInput");

const audio =
 document.getElementById("audio");

const trackList =
 document.getElementById("trackList");

const mainCover =
 document.getElementById("mainCover");

const defaultCover =
 document.getElementById("defaultCover");

const songTitle =
 document.getElementById("songTitle");

const songMeta =
 document.getElementById("songMeta");

let tracks=[];
let currentTrack=0;

musicInput.addEventListener("change",async e=>{

 const files=[...e.target.files];

 for(const file of files){

  let cover=null;

  try{
   cover=await extractMP3Cover(file);
  }catch(err){}

  tracks.push({
   file:file,
   name:file.name.replace(/\.[^/.]+$/,""),
   cover:cover,
   url:URL.createObjectURL(file)
  });
 }

 renderTracks();

 if(tracks.length && !audio.src){
  loadTrack(0);
 }
});


function renderTracks(){

 trackList.innerHTML="";

 tracks.forEach((track,index)=>{

  const item=document.createElement("div");
  item.className="track";

  if(index===currentTrack)
   item.classList.add("active");

  const img=document.createElement("img");
  img.className="track-cover";

  if(track.cover){
   img.src=track.cover;
  }else{
   img.src="";
  }

  const info=document.createElement("div");
  info.className="track-info";

  const name=document.createElement("div");
  name.className="track-name";
  name.textContent=track.name;

  const duration=document.createElement("div");
  duration.className="track-duration";
  duration.textContent="آهنگ";

  info.appendChild(name);
  info.appendChild(duration);

  item.appendChild(img);
  item.appendChild(info);

  item.onclick=()=>loadTrack(index);

  trackList.appendChild(item);

 });
}


function loadTrack(index){

 if(!tracks[index]) return;

 currentTrack=index;

 const track=tracks[index];

 audio.src=track.url;

 songTitle.textContent=track.name;

 songMeta.textContent=
   `${index+1} از ${tracks.length} آهنگ`;

 if(track.cover){

  mainCover.src=track.cover;
  mainCover.style.display="block";
  defaultCover.style.display="none";

 }else{

  mainCover.style.display="none";
  defaultCover.style.display="block";

 }

 audio.play().catch(()=>{});

 document.getElementById("playBtn")
   .textContent="❚❚";

 renderTracks();
}


function togglePlay(){

 if(!audio.src) return;

 if(audio.paused){

  audio.play();
  document.getElementById("playBtn").textContent="❚❚";

 }else{

  audio.pause();
  document.getElementById("playBtn").textContent="▶";

 }
}


audio.addEventListener("play",()=>{
 document.getElementById("playBtn").textContent="❚❚";
});

audio.addEventListener("pause",()=>{
 document.getElementById("playBtn").textContent="▶";
});

audio.addEventListener("ended",()=>{
 nextTrack();
});


function nextTrack(){

 if(!tracks.length) return;

 let next=currentTrack+1;

 if(next>=tracks.length)
  next=0;

 loadTrack(next);
}


function previousTrack(){

 if(!tracks.length) return;

 let prev=currentTrack-1;

 if(prev<0)
  prev=tracks.length-1;

 loadTrack(prev);
}


/* =====================================================
   MP3 ID3 APIC COVER
   ===================================================== */

async function extractMP3Cover(file){

 if(!file.name.toLowerCase().endsWith(".mp3"))
  return null;

 const buffer=await file.arrayBuffer();

 const bytes=new Uint8Array(buffer);

 if(
  bytes.length<10 ||
  bytes[0]!==0x49 ||
  bytes[1]!==0x44 ||
  bytes[2]!==0x33
 ) return null;

 const tagSize=
   ((bytes[6]&0x7f)<<21) |
   ((bytes[7]&0x7f)<<14) |
   ((bytes[8]&0x7f)<<7) |
   (bytes[9]&0x7f);

 let pos=10;
 const end=Math.min(bytes.length,10+tagSize);

 while(pos+10<=end){

  const id=
   String.fromCharCode(
    bytes[pos],
    bytes[pos+1],
    bytes[pos+2],
    bytes[pos+3]
   );

  if(!id.trim()) break;

  const size=
   (bytes[pos+4]<<24) |
   (bytes[pos+5]<<16) |
   (bytes[pos+6]<<8) |
   bytes[pos+7];

  if(size<=0) break;

  if(id==="APIC"){

   const start=pos+10;
   const frameEnd=Math.min(start+size,end);

   let p=start;

   p++;

   while(p<frameEnd && bytes[p]!==0)
    p++;

   p++;

   if(p>=frameEnd) return null;

   p++;

   while(p<frameEnd && bytes[p]!==0)
    p++;

   p++;

   if(p>=frameEnd) return null;

   const imageBytes=bytes.slice(p,frameEnd);

   let type="image/jpeg";

   if(
    imageBytes[0]===0x89 &&
    imageBytes[1]===0x50
   ){
    type="image/png";
   }

   const blob=new Blob(
    [imageBytes],
    {type:type}
   );

   return URL.createObjectURL(blob);
  }

  pos+=10+size;
 }

 return null;
}


/* =====================================================
   CALCULATOR
   ===================================================== */

let calcValue="";

function calcInput(value){

 if(calcValue==="ERROR")
  calcValue="";

 calcValue+=value;

 document.getElementById("calcDisplay")
   .textContent=calcValue || "0";
}


function clearCalc(){

 calcValue="";

 document.getElementById("calcDisplay")
   .textContent="0";
}


function backCalc(){

 calcValue=calcValue.slice(0,-1);

 document.getElementById("calcDisplay")
   .textContent=calcValue || "0";
}


function calculate(){

 if(!calcValue) return;

 try{

  if(!/^[0-9+\-*/%.() ]+$/.test(calcValue))
   throw new Error();

  let expression=
   calcValue.replace(/%/g,"/100");

  let result=Function(
   '"use strict";return ('+
   expression+
   ')'
  )();

  if(!Number.isFinite(result))
   throw new Error();

  calcValue=String(result);

  document.getElementById("calcDisplay")
   .textContent=calcValue;

 }catch(e){

  calcValue="ERROR";

  document.getElementById("calcDisplay")
   .textContent="ERROR";
 }
}

let map;

function initMap(){

function setMarker(lat,lng){

 if(marker)
  map.removeLayer(marker);

 marker=L.marker([lat,lng]).addTo(map);

 document.getElementById("coordinates")
  .textContent=
  "مختصات: "+
  lat.toFixed(6)+
  " , "+
  lng.toFixed(6);

 map.setView([lat,lng],15);
}


async function searchMap(){

 const input=
  document.getElementById("mapSearch");

 const query=input.value.trim();

 if(!query) return;

 try{

  const response=await fetch(
   "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+
   encodeURIComponent(query),
   {
    headers:{
     "Accept":"application/json"
    }
   }
  );

  const data=await response.json();

  if(!data.length){

   showModal(
    "نقشه",
    "مکان موردنظر پیدا نشد.",

   );

  }

  const lat=parseFloat(data[0].lat);
  const lon=parseFloat(data[0].lon);

 }catch(e){

  showModal(
   "خطای نقشه",
   "جستجو انجام نشد.",
   "اتصال اینترنت را بررسی کنید."

}


function myLocation(){

   ===================================================== */

let chatHistory=[];

function addMessage(role,text){

 const container=
  document.getElementById("aiMessages");

 const welcome=
  document.getElementById("welcome");

 if(welcome)
  welcome.remove();

 const msg=document.createElement("div");
 msg.className="msg "+role;

 const name=document.createElement("div");
 name.className="msg-name";
 name.textContent=
  role==="user" ? "شما" : "FOX AI";

 const body=document.createElement("div");
 body.className="msg-text";

 body.innerHTML=formatAIText(text);

 const actions=document.createElement("div");
 actions.className="msg-actions";

 const copy=document.createElement("button");
 copy.className="msg-action";
 copy.textContent="کپی";

 copy.onclick=()=>{
  navigator.clipboard.writeText(text);
 };

 const share=document.createElement("button");
 share.className="msg-action";
 share.textContent="اشتراک‌گذاری";

 share.onclick=()=>{
  shareText(text);
 };

 actions.appendChild(copy);
 actions.appendChild(share);

 msg.appendChild(name);
 msg.appendChild(body);
 msg.appendChild(actions);

 container.appendChild(msg);

 container.scrollTop=container.scrollHeight;
}


function formatAIText(text){

 const escaped=text
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

 let html=escaped;

 html=html.replace(
  /```([\s\S]*?)```/g,
  (match,code)=>{

   const safe=code.trim()
    .replace(/"/g,"&quot;");

   return `
    <div class="code">
      <button class="code-copy"
      onclick="copyCode(this)">کپی</button>
      ${code.trim()}
    </div>
   `;
  }
 );

 html=html.replace(
  /\n/g,
  "<br>"
 );

 return html;
}


function copyCode(btn){

 const code=
  btn.parentElement
   .innerText
   .replace("کپی","")
   .trim();

 navigator.clipboard.writeText(code);

 btn.textContent="کپی شد";

 setTimeout(()=>{
  btn.textContent="کپی";
 },1000);
}


async function sendAI(){

 const input=
  document.getElementById("aiInput");

 const sendBtn=
  document.getElementById("sendBtn");

 const text=input.value.trim();

 if(!text) return;

 if(
  !GEMINI_API_KEY ||
  GEMINI_API_KEY==="کلید_جیمینای_خودت"
 ){

  showModal(
   "کلید Gemini",
   "کلید API هنوز وارد نشده است.",
   "در کد، مقدار GEMINI_API_KEY را با کلید خودت جایگزین کن."
  );

  return;
 }

 addMessage("user",text);

 input.value="";
 input.style.height="auto";

 sendBtn.disabled=true;

 const container=
  document.getElementById("aiMessages");

 const typing=document.createElement("div");

 typing.className="typing";
 typing.id="typing";

 typing.textContent="FOX AI در حال پاسخ‌گویی...";

 container.appendChild(typing);

 container.scrollTop=container.scrollHeight;

 try{

  /*
   درخواست رسمی Gemini REST
  */

  const contents=[
   {
    role:"user",
    parts:[
     {
      text:text
     }
    ]
   }
  ];

  const response=await fetch(
   GEMINI_URL,
   {
    method:"POST",

    headers:{
     "Content-Type":"application/json",
     "x-goog-api-key":GEMINI_API_KEY
    },

    body:JSON.stringify({
     contents:contents,

     generationConfig:{
      temperature:0.7,
      maxOutputTokens:2048
     }
    })
   }
  );

  const raw=await response.text();

  let data={};

  try{
   data=JSON.parse(raw);
  }catch(e){}

  if(!response.ok){

   let errorText=
    data?.error?.message ||
    raw ||
    "خطای نامشخص از Gemini";

   throw new Error(
    "HTTP "+response.status+
    ": "+errorText
   );
  }

  let answer="";

  if(
   data.candidates &&
   data.candidates[0] &&
   data.candidates[0].content &&
   data.candidates[0].content.parts
  ){

   answer=
    data.candidates[0].content.parts
     .map(p=>p.text || "")
     .join("");
  }

  if(!answer){

   answer="Gemini پاسخی برنگرداند.";
  }

  if(typing)
   typing.remove();

  addMessage("ai",answer);

  chatHistory.push({
   user:text,
   ai:answer,
   time:Date.now()
  });

  saveHistory();

 }catch(error){

  if(typing)
   typing.remove();

  addMessage(
   "ai",
   "اتصال به Gemini انجام نشد.\n\n"+
   error.message
  );

 }finally{

  sendBtn.disabled=false;
  input.focus();
 }
}

   ===================================================== */

function saveHistory(){

 localStorage.setItem(
  "fox_gemini_history",
  JSON.stringify(chatHistory)
 );

 renderHistory();
}


function loadHistory(){

 try{

  chatHistory=
   JSON.parse(
    localStorage.getItem(
     "fox_gemini_history"
    ) || "[]"
   );

 }catch(e){

  chatHistory=[];
 }

 renderHistory();
}


function renderHistory(){

 const box=
  document.getElementById("historyList");

 box.innerHTML="";

 [...chatHistory]
 .reverse()
 .slice(0,30)
 .forEach((item,index)=>{

  const div=
   document.createElement("div");

  div.className="history-item";

  div.textContent=item.user;

  div.onclick=()=>{
   showTab("ai",
    document.querySelectorAll(".nav-btn")[3]
   );

   addMessage("user",item.user);
   addMessage("ai",item.ai);

   closeMenu();
  };

  box.appendChild(div);
 });
}


function clearHistory(){

 chatHistory=[];

 localStorage.removeItem(
  "fox_gemini_history"
 );

 renderHistory();

 showModal(
  "سابقه گفتگو",

}
